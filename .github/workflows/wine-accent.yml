name: Apply wine accent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply wine palette
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          old = "--green:#0f8b43;--pale:#dff8e8;"
          new = "--green:#7A1F3D;--pale:#F3D8E2;"
          if old not in s:
              raise SystemExit("Expected accent token not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change portfolio accent to wine"
          git push
