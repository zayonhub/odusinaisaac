name: Replace hero portrait

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified portrait
        run: |
          curl -L --fail --retry 3 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-5f28-8246-a580-4b358a4fae48/raw?se=2026-09-16T02%3A35%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=f4963fee-0756-5695-9a60-56bcf1de0dfa&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A20%3A00Z&ske=2026-09-16T19%3A20%3A00Z&sks=b&skv=2026-02-06&sig=ejY1DjEXEKrGFbuKswbkIPGBEjsThFJ8lYCP7QWBGWc%3D' -o assets/odusina-isaac-headshot.jpg
          test "$(stat -c%s assets/odusina-isaac-headshot.jpg)" -eq 458941
          echo 'd864aa1567741cfdad722d20b70f8a2140e4a6809bc88e85b52c5995ed7b2a74  assets/odusina-isaac-headshot.jpg' | sha256sum -c -
          file assets/odusina-isaac-headshot.jpg | grep -q 'JPEG image data'
      - name: Commit replacement
        run: |
          rm .github/workflows/replace-hero-photo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/odusina-isaac-headshot.jpg .github/workflows/replace-hero-photo.yml
          git commit -m "Replace hero portrait with undistorted original"
          git push
