name: Import portfolio assets
on:
  push:
    paths:
      - '.github/workflows/import-portfolio-assets.yml'
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download Drive exports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/portfolio-src
          curl -L --fail 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-d990-81f4-b09c-9c440daf4bde/raw?se=2026-09-16T01%3A34%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=80dd151d-d057-55cb-9be2-bc44d9693eb3&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A12%3A35Z&ske=2026-09-16T19%3A12%3A35Z&sks=b&skv=2026-02-06&sig=pWdeToUlQTwjfnrakhBqC%2B7P/60AzA0Iza1WsIVLepU%3D' -o '/tmp/portfolio-src/wingate-email.png'
          curl -L --fail 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-156c-8210-bc0c-6ee28c2251a7/raw?se=2026-09-16T01%3A34%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=2a6de40d-f2bb-5499-995c-0ea4694fb26a&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A22%3A21Z&ske=2026-09-16T19%3A22%3A21Z&sks=b&skv=2026-02-06&sig=t7%2BRg0eqayJJXucc0qiV14Cmmx4gvKIGiN1Xdvskex8%3D' -o '/tmp/portfolio-src/wingate-january-promo.png'
          curl -L --fail 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f080-8210-be31-b0f7c9abbe1b/raw?se=2026-09-16T01%3A34%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=b4174c82-6e37-51ac-b173-6c34fb6e49c0&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A05%3A23Z&ske=2026-09-16T19%3A05%3A23Z&sks=b&skv=2026-02-06&sig=8ptDHNpMPRGri74f1g90T9OtHACtdhpmSb1EcZPgxK4%3D' -o '/tmp/portfolio-src/wingate-hotelcs.png'
          curl -L --fail 'https://sdmntprukwest.oaiusercontent.com/files/00000000-c0c4-8243-864c-cc838c874f26/raw?se=2026-09-16T01%3A34%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=491a08a1-3266-56fa-9e9f-8088d9e20e64&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A22%3A28Z&ske=2026-09-16T19%3A22%3A28Z&sks=b&skv=2026-02-06&sig=9JbJ7te7JAy53qWdjqv2OQwQBrbEuLM5n2QLR8qRVlg%3D' -o '/tmp/portfolio-src/yellow-yolk-feeds-bag-b.png'
          curl -L --fail 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-32b4-8210-98c3-1c9c50597d7c/raw?se=2026-09-16T01%3A34%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=a63e7808-e7a6-5196-9f3c-bedd7d25d210&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A10%3A15Z&ske=2026-09-16T19%3A10%3A15Z&sks=b&skv=2026-02-06&sig=Wa6oB38D5kdkhEpbuP%2BKqLEKRVjsWw6/luTu7AlZSRc%3D' -o '/tmp/portfolio-src/yellow-yolk-feeds-bag-a.png'
          curl -L --fail 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-0dc4-820a-b08d-9eecb7769889/raw?se=2026-09-16T01%3A33%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=293a7163-ad0c-535c-ba80-97ad2a137377&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A15%3A05Z&ske=2026-09-16T19%3A15%3A05Z&sks=b&skv=2026-02-06&sig=4W2V3iQg7mSICYsO8kOSe6jDbGq9i9TBMWnGiBmoDC8%3D' -o '/tmp/portfolio-src/foot-impact-logo.png'
          curl -L --fail 'https://sdmntprukwest.oaiusercontent.com/files/00000000-c434-8243-9002-fade6e03f3d3/raw?se=2026-09-16T01%3A33%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=7e5247db-a785-5a6a-9ad2-a1b01da89433&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A22%3A23Z&ske=2026-09-16T19%3A22%3A23Z&sks=b&skv=2026-02-06&sig=RY5DJGu8ulwiuvIlWGBWJYfRu5zAnAeaIcHJZmBUmYE%3D' -o '/tmp/portfolio-src/sparkles-logo-c.png'
      - name: Optimise for the web
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          jobs={
            'wingate-email.png':'assets/portfolio/social-media/wingate-exotic-hotel/wingate-email.webp',
            'wingate-january-promo.png':'assets/portfolio/social-media/wingate-exotic-hotel/wingate-january-promo.webp',
            'wingate-hotelcs.png':'assets/portfolio/social-media/wingate-exotic-hotel/wingate-hotelcs.webp',
            'yellow-yolk-feeds-bag-a.png':'assets/portfolio/packaging/yellow-yolk-feeds/yellow-yolk-feeds-bag-a.webp',
            'yellow-yolk-feeds-bag-b.png':'assets/portfolio/packaging/yellow-yolk-feeds/yellow-yolk-feeds-bag-b.webp',
            'foot-impact-logo.png':'assets/portfolio/branding/foot-impact/foot-impact-logo.webp',
            'sparkles-logo-c.png':'assets/portfolio/branding/sparkles-packaging/sparkles-logo-c.webp'
          }
          for src,dst in jobs.items():
              im=Image.open('/tmp/portfolio-src/'+src)
              if im.mode in ('RGBA','LA'):
                  bg=Image.new('RGB',im.size,'white'); bg.paste(im,mask=im.getchannel('A')); im=bg
              else: im=im.convert('RGB')
              if im.width>1800: im=im.resize((1800,round(im.height*1800/im.width)),Image.Resampling.LANCZOS)
              out=Path(dst); out.parent.mkdir(parents=True,exist_ok=True); im.save(out,'WEBP',quality=82,method=6)
          PY
      - name: Commit imported assets and retire importer
        run: |
          git config user.name 'zayonhub'
          git config user.email '63724881+zayonhub@users.noreply.github.com'
          git add assets/portfolio
          git rm .github/workflows/import-portfolio-assets.yml
          git commit -m 'Import curated portfolio assets from Design exports'
          git push
