name: Apply hero portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hero-photo.yml'

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build optimized portrait asset
        run: |
          mkdir -p assets
          cat .tmp/headshot.part1 .tmp/headshot.part2 .tmp/headshot.part3 .tmp/headshot.part4 .tmp/headshot.part5 > /tmp/headshot.b64
          base64 --decode /tmp/headshot.b64 > assets/odusina-isaac-headshot.webp
          test -s assets/odusina-isaac-headshot.webp

      - name: Update hero layout and portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = [
            (
              ".hero{padding:145px 0 85px;min-height:90vh;display:flex;align-items:center}",
              ".hero{padding:150px 0 115px;min-height:auto;display:flex;align-items:center}"
            ),
            (
              ".hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:70px;align-items:center}",
              ".hero-grid{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(320px,.78fr);gap:clamp(42px,6vw,82px);align-items:center}"
            ),
            (
              ".hero h1{font:800 clamp(56px,8.5vw,118px)/.87 'Manrope';letter-spacing:-.075em}",
              ".hero h1{font:800 clamp(52px,7.6vw,104px)/.94 'Manrope';letter-spacing:-.065em;max-width:820px;text-wrap:balance}"
            ),
            (
              ".hero-copy p{font-size:18px;max-width:430px;color:#444}",
              ".hero-copy{margin-top:30px}.hero-copy p{font-size:18px;max-width:460px;color:#444}"
            ),
            (
              ".portrait{position:relative;max-width:390px;margin-left:auto}",
              ".portrait{position:relative;width:100%;max-width:430px;margin-left:auto}"
            ),
            (
              ".portrait-frame{background:#e7e7e1;border:1px solid var(--ink);aspect-ratio:4/5;overflow:hidden;position:relative;box-shadow:18px 18px 0 var(--green)}",
              ".portrait-frame{background:#e7e7e1;border:1px solid var(--ink);aspect-ratio:1/1;overflow:hidden;position:relative;box-shadow:18px 18px 0 var(--green)}"
            ),
            (
              ".portrait-frame img{width:100%;height:100%;object-fit:cover}",
              ".portrait-frame img{width:100%;height:100%;object-fit:cover;object-position:center center}"
            ),
            (
              '<div class="portrait-frame"><img src="assets/odusina-isaac-placeholder.svg" alt="Portrait placeholder for Odusina Isaac"><div class="portrait-placeholder">ODUSINA ISAAC<small>Replace with your professional portrait</small></div></div>',
              '<div class="portrait-frame"><img src="assets/odusina-isaac-headshot.webp" alt="Professional portrait of Odusina Isaac"></div>'
            ),
            (
              ".hero h1{font-size:clamp(49px,16vw,78px)}",
              ".hero h1{font-size:clamp(46px,14vw,68px);line-height:.96}"
            ),
            (
              ".hero{padding-top:120px;min-height:auto}",
              ".hero{padding:120px 0 76px;min-height:auto}"
            )
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected pattern not found: {old[:100]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit hero update
        run: |
          rm -rf .tmp
          rm -f .github/workflows/apply-hero-photo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add portrait and refine hero spacing"
          git push
